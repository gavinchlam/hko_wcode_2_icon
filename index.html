<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: transparent; display: flex; justify-content: center; align-items: center; }
    #weatherIconContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
    }
    img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: contrast(250%) brightness(60%) drop-shadow(0 0 0.5px #000);
      transition: opacity 0.2s;
    }
    .warning-icon {
      width: 40px;
      height: 40px;
    }

  </style>
</head>
<body>
  <div id="weatherIconContainer"></div>

  <script>
    // 1. 定義天氣號碼對應嘅 Icon URL (對應地圖 Mapping Object)
    const iconMap = {
      "tc1":    "https://www.hko.gov.hk/images/HKOWarningSymbols/tc1.gif",
      "tc3":    "https://www.hko.gov.hk/images/HKOWarningSymbols/tc3.gif",
      "tc8ne":  "https://www.hko.gov.hk/images/HKOWarningSymbols/tc8ne.gif",
      "800":    "https://www.hko.gov.hk/images/HKOWarningSymbols/warn800_12_ts.png", // 雷暴
      "raina":  "https://www.hko.gov.hk/images/HKOWarningSymbols/raina.gif",
      "rainr":  "https://www.hko.gov.hk/images/HKOWarningSymbols/rainr.gif",
      "rainb":  "https://www.hko.gov.hk/images/HKOWarningSymbols/rainb.gif"
    };

    // 1. 讀取 URL 網址裡面的 ?d= 參數
    const urlParams = new URLSearchParams(window.location.search);
    
    // 如果冇傳 ?d=，預設為 0 (翌日)；並用 parseInt 確保係數字
    let dayIndex = parseInt(urlParams.get('d'), 10);
    if (isNaN(dayIndex) || dayIndex < 0) {
      dayIndex = 0; 
    }

    function renderWeatherIcons(sources, type) {
      const container = document.getElementById('weatherIconContainer');
      container.innerHTML = '';

      if (type == "forecast") {
        sources.forEach((src) => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = 'weather icon';
          container.appendChild(img);
        });
      } else if (type == "warning") {
        sources.forEach((src) => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = 'weather icon';
          img.classList.add('warning-icon');
          container.appendChild(img);
        });
      }
    }

    // 2. Fetch 外來天氣 API (例如 HKO Open Data)
    async function updateWeatherIcon() {
      try {
        let iconCode = '';

        if (dayIndex < 9) {
          const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=en');
          
          const data = await res.json();

          console.log(dayIndex);
          console.log(JSON.stringify(data, null, 2));
          
          // 假設從 API 攞到嘅 icon 號碼
          iconCode = data.weatherForecast[dayIndex].ForecastIcon; 

          // 3. 用 IF / ELSE 或 Mapping 換相對應嘅圖
          //if (iconMap[iconCode]) {
          //  imgElement.src = iconMap[iconCode];
          //} else {
            // Default Icon (預設圖片)
          renderWeatherIcons([`./icons/pic${iconCode}.png`], 'forecast');
          //imgLoader.onload = () => {
            // 確定圖片下載完畢才賦值給 DOM
          //  document.getElementById('weatherIcon').src = targetUrl;
          //};
          // imgElement.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
        } else if (dayIndex == 99) { // 即時天氣
          const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
          
          const data = await res.json();

          console.log(dayIndex);
          console.log(JSON.stringify(data, null, 2));
          
          // 假設從 API 攞到嘅 icon 號碼
          iconCode = data.icon; 

          // 3. 用 IF / ELSE 或 Mapping 換相對應嘅圖
          //if (iconMap[iconCode]) {
          //  imgElement.src = iconMap[iconCode];
          //} else {
            // Default Icon (預設圖片)
          //imgElement.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconCode}.png`;
          renderWeatherIcons([`./icons/pic${iconCode}.png`], 'forecast');
        } else if (dayIndex == 100) { //天氣警告一覽
          const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en');
          
          const data = await res.json();

          console.log(dayIndex);
          console.log(JSON.stringify(data, null, 2));
          
          const warningIconSources = [];

          if (data.WTS) {
            console.log(data.WTS.actionCode);
            //if (data.WTS.actionCode !== "CANCEL") {
              warningIconSources.push('./icons/WTS.png');
            //}
          }
          if (data.WHOT) {
            console.log(data.WHOT.actionCode);
            if (data.WHOT.actionCode !== "CANCEL") {
              warningIconSources.push('./icons/WHOT.png');
            }
          }
          if (data.WCOLD) {
            console.log(data.WCOLD.actionCode);
            if (data.WCOLD.actionCode !== "CANCEL") {
              warningIconSources.push('./icons/WCOLD.png');
            }
          }
          if (data.WFROST) {
            console.log(data.WFROST.actionCode);
            if (data.WFROST.actionCode !== "CANCEL") {
              warningIconSources.push('./icons/WFROST.png');
            }
          }
          if (data.WTCSGNL) {
            console.log(data.WTCSGNL.actionCode);
            if (data.WTCSGNL.actionCode !== "CANCEL" || data.WTCSGNL.code !== "CANCEL") {
              if (data.WTCSGNL.code === "TC1") {
                warningIconSources.push('./icons/TC1.png');
              } else if (data.WTCSGNL.code === "TC3") {
                warningIconSources.push('./icons/TC3.png');
              } else if (data.WTCSGNL.code === "TC8NE") {
                warningIconSources.push('./icons/TC8NE.png');
              } else if (data.WTCSGNL.code === "TC8SE") {
                warningIconSources.push('./icons/TC8SE.png');
              } else if (data.WTCSGNL.code === "TC8NW") {
                warningIconSources.push('./icons/TC8NW.png');
              } else if (data.WTCSGNL.code === "TC8SW") {
                warningIconSources.push('./icons/TC8SW.png');
              } else if (data.WTCSGNL.code === "TC9") {
                warningIconSources.push('./icons/TC9.png');
              } else if (data.WTCSGNL.code === "TC10") {
                warningIconSources.push('./icons/TC10.png');
              } 
            }
          }
          if (data.WRAIN) {
            console.log(data.WRAIN.actionCode);
            //if (data.WRAIN.actionCode !== "CANCEL") {
              if (data.WRAIN.code === "WRAINA") {
                warningIconSources.push('./icons/WRAINA.png');
              } else if (data.WRAIN.code === "WRAINR") {
                warningIconSources.push('./icons/WRAINR.png');
              } else if (data.WRAIN.code === "WRAINB") {
                warningIconSources.push('./icons/WRAINB.png');
              }
            //}
          }
          //warningIconSources.push('./icons/WTS.png');
          renderWeatherIcons(warningIconSources, 'warning');
        }
        //}
      } catch (err) {
        console.error("Fetch weather icon error:", err);
      }
    }
    updateWeatherIcon();
    // 每 10 分鐘自動更新一次
    // setInterval(updateWeatherIcon, 600000);
  </script>
</body>
</html>
